version: 1
rules:
  - id: deny-no-identity
    deny: peer == null || jwt == null

  - id: allow-admin
    allow: any_scope("order:admin")

  - id: allow-service-readonly
    allow: any_peer("svc-a") &&
           peer.auid == "ap12345" &&
           any_operation("Order_Get", "Order_List")

  - id: deny-all
    deny: "true"
