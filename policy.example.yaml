version: 1
rules:
  - id: deny-no-identity
    deny: peer == null || jwt == null

  - id: allow-admin
    allow: jwt != null && "order:admin" in jwt["scopes"]

  - id: allow-service-readonly
    allow: peer != null &&
           peer.cn == "svc-a" &&
           peer.auid == "ap12345" &&
           operation.id in ["Order_Get", "Order_List"]

  - id: deny-all
    deny: "true"
